<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JS2Love - Settings Demo</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    canvas {
      border: 2px solid #4a5568;
      background: #000;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
    }

    .info {
      position: absolute;
      top: 20px;
      left: 20px;
      color: white;
      font-size: 14px;
      background: rgba(0, 0, 0, 0.7);
      padding: 15px;
      border-radius: 8px;
      backdrop-filter: blur(10px);
    }

    .info h2 {
      margin: 0 0 10px 0;
      font-size: 18px;
      color: #ffd700;
    }

    .info p {
      margin: 5px 0;
      font-size: 12px;
      color: #aaa;
    }

    .shortcuts {
      position: absolute;
      bottom: 20px;
      left: 20px;
      color: white;
      font-size: 12px;
      background: rgba(0, 0, 0, 0.7);
      padding: 10px 15px;
      border-radius: 8px;
      backdrop-filter: blur(10px);
    }

    .shortcuts kbd {
      background: #333;
      padding: 2px 6px;
      border-radius: 3px;
      font-family: monospace;
      border: 1px solid #555;
    }
  </style>
</head>

<body>
  <div class="info">
    <h2>⚙️ Sistema de Configurações</h2>
    <p>✓ Volume com categorias (master, música, efeitos)</p>
    <p>✓ Fullscreen (F11)</p>
    <p>✓ Save/Load automático (LocalStorage)</p>
    <p>✓ Export/Import de configurações</p>
    <p>✓ Callbacks de mudança</p>
  </div>

  <div class="shortcuts">
    <kbd>F11</kbd> Fullscreen &nbsp;|&nbsp;
    <kbd>F12</kbd> Console (ver logs)
  </div>

  <canvas id="gameCanvas"></canvas>

  <script>
    window.CANVAS_WIDTH = 640;
    window.CANVAS_HEIGHT = 580;
    window.PIXELED = false;
  </script>
  
  <script src="./JS2Love/modules/metter.min.js"></script>
  <script src="./JS2Love/love.js"></script>
  <script type="module" src="exempleSettings.js"></script>
</body>

</html>
